# Laboratorio P0-01 · servicio FastAPI + Ollama en CPU.
# Regla de la Forja: los puertos se publican SOLO en 127.0.0.1 (nada expuesto a la red local).
#   docker compose up -d --build
#   docker compose exec ollama ollama pull llama3.2:1b
#   docker compose down            (el modelo se queda en el volumen ollama_datos)

services:
  ollama:
    image: ollama/ollama:0.40.16   # comprobada en Docker Hub el 2026-11-10
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_datos:/root/.ollama

  servicio:
    build: .
    environment:
      OLLAMA_URL: "http://ollama:11434"   # nombre del servicio en la red interna de compose
      MODELO: "llama3.2:1b"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama

volumes:
  ollama_datos:
