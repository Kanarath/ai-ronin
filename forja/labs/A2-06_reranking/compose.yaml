# Laboratorio A2-06 · buscador de la biblioteca con reordenación + Ollama en CPU.
# Regla de la Forja: los puertos se publican SOLO en 127.0.0.1.
#
#   docker compose up -d --build
#   docker compose exec ollama ollama pull embeddinggemma
#   docker compose exec ollama ollama pull llama3.2:1b
#   docker compose restart buscador        (la ingesta se hace al arrancar, con los modelos ya descargados)
#
# El buscador descarga el cross-encoder de Hugging Face en la primera búsqueda con reordenador
# "cross-encoder" (revisión fijada en reranking.py) y lo guarda en el volumen hf_cache.

services:
  ollama:
    image: ollama/ollama:0.40.16    # comprobada en Docker Hub el 2026-11-10
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_datos:/root/.ollama

  buscador:
    build:
      context: ..                   # forja/labs: el servicio reutiliza los documentos de A2-04
      dockerfile: A2-06_reranking/Dockerfile
    environment:
      OLLAMA_URL: "http://ollama:11434"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf_cache:/home/forja/.cache/huggingface
    depends_on:
      - ollama

volumes:
  ollama_datos:
  hf_cache:
